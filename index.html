<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Experiences | WebGL Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #06060f;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ===== HEADER ===== */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 101;
      background: rgba(6, 6, 15, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 24px 6px;
    }

    .logo {
      font-size: 18px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-brand h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.85);
    }

    .header-nav {
      position: fixed;
      top: 50px; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 2px;
      padding: 0 16px 0;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(6, 6, 15, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header-nav::-webkit-scrollbar { display: none; }

    .tab {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      padding: 14px 18px 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .tab:hover { color: rgba(255,255,255,0.65); }
    .tab.active { color: #fff; }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 25%; right: 25%;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 2px;
    }

    .tab-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      margin-right: 6px;
      opacity: 0.45;
    }

    .tab-short { display: none; }

    /* ===== CANVAS ===== */
    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      transition: opacity 0.35s ease;
    }

    /* ===== INFO CARD ===== */
    .info-card {
      position: fixed;
      bottom: 32px; left: 32px;
      max-width: 400px;
      padding: 24px 28px;
      background: rgba(30,30,30,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      z-index: 50;
      opacity: 0;
      transform: translateY(16px);
      animation: cardIn 0.6s ease-out 0.3s forwards;
    }

    .info-card .tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #a78bfa;
      background: rgba(167,139,250,0.1);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .info-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .info-card p {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.5);
    }

    .info-card .hint {
      display: block;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      margin-top: 14px;
      font-style: italic;
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== FPS BADGE ===== */
    .fps {
      position: fixed;
      top: 90px; right: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      z-index: 50;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      /* Header: only brand, no nav */
      .header-brand {
        padding: 10px 16px;
      }
      .header-brand h1 { font-size: 10px; letter-spacing: 2.5px; }
      .logo { font-size: 14px; }

      /* Nav moves to bottom as tab bar */
      .header-nav {
        top: auto;
        bottom: 0;
        background: rgba(6, 6, 15, 0.94);
        border-top: 1px solid rgba(255,255,255,0.08);
        border-bottom: none;
        padding: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        gap: 0;
        justify-content: stretch;
      }

      /* Tabs: equal width, vertical layout */
      .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 10px 4px 8px;
        font-size: 9.5px;
        letter-spacing: 0.6px;
        min-width: 0;
      }

      .tab-num {
        display: block;
        font-size: 11px;
        margin-right: 0;
        opacity: 0.35;
        line-height: 1;
      }

      .tab.active .tab-num { opacity: 0.7; }

      .tab-full { display: none; }
      .tab-short { display: block; font-size: 9px; line-height: 1; }

      /* Active indicator on top instead of bottom */
      .tab.active::after {
        bottom: auto;
        top: 0;
        left: 20%; right: 20%;
        height: 2px;
      }

      /* Info card: above the bottom bar */
      .info-card {
        bottom: calc(64px + env(safe-area-inset-bottom, 0px));
        left: 12px; right: 12px;
        max-width: none;
        padding: 16px 18px;
        border-radius: 12px;
      }
      .info-card h2 { font-size: 16px; margin-bottom: 6px; }
      .info-card p { font-size: 12px; line-height: 1.5; }
      .info-card .tag { font-size: 9px; padding: 3px 8px; margin-bottom: 8px; }
      .info-card .hint { font-size: 10px; margin-top: 10px; }

      .fps { display: none; }
    }

    /* Extra small (iPhone SE, 375px and below) */
    @media (max-width: 380px) {
      .header-brand h1 { font-size: 9px; letter-spacing: 2px; }
      .tab-short { font-size: 8px; }
      .tab-num { font-size: 10px; }
      .tab { padding: 8px 2px 6px; }
    }

    /* ===== HAND TRACKING ===== */
    #handVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
      display: none;
    }

    .hand-loading {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 90;
      background: rgba(6,6,15,0.85);
      gap: 16px;
    }
    .hand-loading p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 400;
    }
    .hand-loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <span class="logo">&#9670;</span>
      <h1>INTERACTIVE 3D EXPERIENCES</h1>
    </div>
  </header>

  <nav class="header-nav" id="navTabs">
    <button class="tab active" data-demo="particles"><span class="tab-num">01</span><span class="tab-full">Cosmic Particles</span><span class="tab-short">Particles</span></button>
    <button class="tab" data-demo="blob"><span class="tab-num">02</span><span class="tab-full">Liquid Metal</span><span class="tab-short">Metal</span></button>
    <button class="tab" data-demo="terrain"><span class="tab-num">03</span><span class="tab-full">Digital Terrain</span><span class="tab-short">Terrain</span></button>
    <button class="tab" data-demo="geometry"><span class="tab-num">04</span><span class="tab-full">Crystal Objects</span><span class="tab-short">Objects</span></button>
    <button class="tab" data-demo="shader"><span class="tab-num">05</span><span class="tab-full">Neon Flow</span><span class="tab-short">Flow</span></button>
    <button class="tab" data-demo="hands"><span class="tab-num">06</span><span class="tab-full">Rasengan</span><span class="tab-short">Rasengan</span></button>
  </nav>

  <video id="handVideo" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="hand-loading" id="handLoading">
    <div class="spinner"></div>
    <p>Initializing hand tracking...</p>
  </div>

  <div class="info-card" id="infoCard">
    <span class="tag" id="infoTag"></span>
    <h2 id="infoTitle"></h2>
    <p id="infoDesc"></p>
    <span class="hint" id="infoHint"></span>
  </div>

  <div class="fps" id="fpsCounter"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================
    //  CONFIG
    // ============================================================
    const DEMO_META = {
      particles: {
        title: 'Cosmic Particles',
        desc: '50,000 particles forming a dynamic spiral galaxy with real-time color interpolation, additive blending, and depth-based point sizing.',
        tag: 'Particle Systems',
        hint: 'Move your mouse to shift the viewpoint'
      },
      blob: {
        title: 'Liquid Metal',
        desc: 'Procedural mesh deformation driven by multi-octave 3D simplex noise with iridescent Fresnel shading and dynamic specular highlights.',
        tag: 'Custom Shaders',
        hint: 'Click & drag to orbit \u2022 Scroll to zoom'
      },
      terrain: {
        title: 'Digital Terrain',
        desc: 'Real-time terrain generation using layered sine-wave vertex displacement with height-mapped colors and auto-computed normals.',
        tag: 'Vertex Animation',
        hint: 'Click & drag to orbit \u2022 Scroll to zoom'
      },
      geometry: {
        title: 'Crystal Objects',
        desc: 'PBR metallic materials on iconic geometries lit by orbiting colored point lights, creating dynamic reflections and color mixing.',
        tag: 'PBR Materials',
        hint: 'Click & drag to orbit \u2022 Scroll to zoom'
      },
      shader: {
        title: 'Neon Flow',
        desc: 'GPU-accelerated generative art built entirely in a GLSL fragment shader, producing flowing luminous curves that react to the cursor.',
        tag: 'Fragment Shaders',
        hint: 'Move your mouse to interact'
      },
      hands: {
        title: 'Rasengan',
        desc: 'Real-time hand tracking creates a spinning energy sphere on each palm. Open your hand to power up and change color. Bring both hands together to merge into one massive Rasengan.',
        tag: 'Computer Vision',
        hint: 'Open/close hand to change size & color \u2022 Two hands close = merge'
      }
    };

    // ============================================================
    //  GLSL SIMPLEX NOISE (Stefan Gustavson)
    // ============================================================
    const NOISE_GLSL = `
      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}

      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0);
        const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy));
        vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz);
        vec3 l=1.0-g;
        vec3 i1=min(g.xyz,l.zxy);
        vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx;
        vec3 x2=x0-i2+C.yyy;
        vec3 x3=x0-D.yyy;
        i=mod289(i);
        vec4 p=permute(permute(permute(
          i.z+vec4(0.0,i1.z,i2.z,1.0))
          +i.y+vec4(0.0,i1.y,i2.y,1.0))
          +i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=1.0/7.0;
        vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z);
        vec4 x_=floor(j*ns.z);
        vec4 y_=floor(j-7.0*x_);
        vec4 x2_=x_*ns.x+ns.yyyy;
        vec4 y2_=y_*ns.x+ns.yyyy;
        vec4 h=1.0-abs(x2_)-abs(y2_);
        vec4 b0=vec4(x2_.xy,y2_.xy);
        vec4 b1=vec4(x2_.zw,y2_.zw);
        vec4 s0=floor(b0)*2.0+1.0;
        vec4 s1=floor(b1)*2.0+1.0;
        vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
        vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x);
        vec3 p1=vec3(a0.zw,h.y);
        vec3 p2=vec3(a1.xy,h.z);
        vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
        m=m*m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
    `;

    // ============================================================
    //  GLOBALS
    // ============================================================
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const demos = {};
    let currentName = 'particles';
    let currentDemo = null;
    let activeControls = null;
    const mouse = { x: 0, y: 0 };

    // FPS counter
    let fpsFrames = 0, fpsLast = performance.now();
    const fpsEl = document.getElementById('fpsCounter');

    // ============================================================
    //  DEMO 1 — COSMIC PARTICLES
    // ============================================================
    function createParticles() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06060f);

      const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 2.5, 5.5);

      const COUNT = 55000;
      const positions = new Float32Array(COUNT * 3);
      const colors    = new Float32Array(COUNT * 3);
      const sizes     = new Float32Array(COUNT);

      const cInner = new THREE.Color('#ff6030');
      const cOuter = new THREE.Color('#1b3984');
      const tmp    = new THREE.Color();

      const BRANCHES = 4;
      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        const r  = Math.random() * 5.5;
        const spin   = r * 3;
        const branch = (i % BRANCHES) * (Math.PI * 2 / BRANCHES);
        const spread = (5.5 - r) / 5.5;

        const rx = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.6 * spread;
        const ry = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.25;
        const rz = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.6 * spread;

        positions[i3]     = Math.cos(branch + spin) * r + rx;
        positions[i3 + 1] = ry;
        positions[i3 + 2] = Math.sin(branch + spin) * r + rz;

        tmp.copy(cInner).lerp(cOuter, r / 5.5);
        colors[i3] = tmp.r; colors[i3+1] = tmp.g; colors[i3+2] = tmp.b;
        sizes[i] = Math.random() * 1.8 + 0.4;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          attribute float aSize;
          attribute vec3 color;
          varying vec3 vColor;
          void main(){
            vColor = color;
            vec4 mv = modelViewMatrix * vec4(position,1.0);
            gl_PointSize = aSize * (220.0 / -mv.z);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main(){
            float d = length(gl_PointCoord - 0.5);
            if(d > 0.5) discard;
            float a = 1.0 - smoothstep(0.05, 0.5, d);
            gl_FragColor = vec4(vColor, a * 0.65);
          }
        `
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);

      return {
        scene, camera,
        needsControls: false,
        update(t) {
          points.rotation.y = t * 0.06;
          camera.position.x = Math.sin(mouse.x * 0.4) * 2.5;
          camera.position.y = 2.5 + mouse.y * 1.0;
          camera.lookAt(0, 0, 0);
        },
        resize(w, h) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
      };
    }

    // ============================================================
    //  DEMO 2 — LIQUID METAL
    // ============================================================
    function createBlob() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06060f);

      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 0, 4.5);

      scene.add(new THREE.AmbientLight(0x222233, 1));
      const dLight = new THREE.DirectionalLight(0xffffff, 2);
      dLight.position.set(3, 4, 5);
      scene.add(dLight);
      const pLight = new THREE.PointLight(0x6366f1, 30, 20);
      pLight.position.set(-3, 2, 3);
      scene.add(pLight);

      const geo = new THREE.IcosahedronGeometry(1.6, 5);

      const mat = new THREE.ShaderMaterial({
        extensions: { derivatives: true },
        uniforms: { uTime: { value: 0 } },
        vertexShader: NOISE_GLSL + `
          uniform float uTime;
          varying vec3 vWorldPos;
          varying vec3 vNorm;
          void main(){
            float n = snoise(normal * 1.8 + uTime * 0.35) * 0.35;
            n += snoise(normal * 3.6 + uTime * 0.25) * 0.18;
            n += snoise(normal * 7.0 + uTime * 0.15) * 0.08;
            vec3 pos = position + normal * n;
            vWorldPos = (modelMatrix * vec4(pos,1.0)).xyz;
            vNorm = normalMatrix * normal;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          varying vec3 vWorldPos;
          varying vec3 vNorm;
          void main(){
            vec3 N = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
            vec3 V = normalize(cameraPosition - vWorldPos);
            float fresnel = pow(1.0 - abs(dot(V, N)), 3.0);

            vec3 c1 = vec3(0.15, 0.35, 1.0);
            vec3 c2 = vec3(1.0, 0.2, 0.55);
            vec3 c3 = vec3(0.2, 1.0, 0.6);
            float angle = dot(V, N);
            vec3 iri = mix(c1, c2, fresnel);
            iri = mix(iri, c3, sin(angle * 3.14 + uTime * 0.8) * 0.5 + 0.5);

            vec3 L = normalize(vec3(3.0, 4.0, 5.0));
            float diff = max(dot(N, L), 0.0);
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 80.0);

            vec3 col = iri * (0.28 + diff * 0.55) + vec3(1.0) * spec * 0.9 + iri * fresnel * 0.45;
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);

      return {
        scene, camera,
        needsControls: true, autoRotate: true,
        controlsCfg: { target: [0,0,0], minDist: 3, maxDist: 8 },
        update(t) {
          mat.uniforms.uTime.value = t;
          mesh.rotation.y = t * 0.08;
        },
        resize(w, h) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
      };
    }

    // ============================================================
    //  DEMO 3 — DIGITAL TERRAIN
    // ============================================================
    function createTerrain() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040410);
      scene.fog = new THREE.FogExp2(0x040410, 0.045);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 6, 12);

      const SEG = 140;
      const geo = new THREE.PlaneGeometry(24, 24, SEG, SEG);
      geo.rotateX(-Math.PI / 2);

      const colorArr = new Float32Array(geo.attributes.position.count * 3);
      geo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));

      const solidMat = new THREE.MeshBasicMaterial({ color: 0x060612, side: THREE.DoubleSide });
      const wireMat  = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: true, transparent: true, opacity: 0.75 });

      const solidMesh = new THREE.Mesh(geo, solidMat);
      const wireMesh  = new THREE.Mesh(geo, wireMat);
      scene.add(solidMesh);
      scene.add(wireMesh);

      const tmpC = new THREE.Color();
      const posArr = geo.attributes.position.array;

      return {
        scene, camera,
        needsControls: true, autoRotate: true,
        controlsCfg: { target: [0,0,0], minDist: 6, maxDist: 25 },
        update(t) {
          for (let i = 0; i < geo.attributes.position.count; i++) {
            const i3 = i * 3;
            const x = posArr[i3];
            const z = posArr[i3 + 2];

            const y = Math.sin(x * 0.35 + t * 0.45) * Math.cos(z * 0.28 + t * 0.32) * 2.2
                    + Math.sin(x * 0.7 + z * 0.5 + t * 0.18) * 0.9
                    + Math.cos(x * 1.1 + t * 0.35) * Math.sin(z * 0.85 + t * 0.12) * 0.5;

            posArr[i3 + 1] = y;

            const ny = (y + 3.6) / 7.2;
            tmpC.setHSL(0.62 - ny * 0.2, 0.85, 0.18 + ny * 0.38);
            colorArr[i3] = tmpC.r; colorArr[i3+1] = tmpC.g; colorArr[i3+2] = tmpC.b;
          }
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
          geo.computeVertexNormals();
        },
        resize(w, h) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
      };
    }

    // ============================================================
    //  DEMO 4 — CRYSTAL OBJECTS
    // ============================================================
    function createGeometry() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06060f);

      const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 1.5, 7);

      scene.add(new THREE.AmbientLight(0x222233, 0.6));

      const lights = [
        new THREE.PointLight(0xff4466, 120, 25),
        new THREE.PointLight(0x4488ff, 120, 25),
        new THREE.PointLight(0x44ffaa, 80,  25)
      ];
      lights.forEach(l => scene.add(l));

      const geos = [
        new THREE.TorusKnotGeometry(0.9, 0.32, 128, 24),
        new THREE.OctahedronGeometry(0.8, 0),
        new THREE.DodecahedronGeometry(0.75, 0),
        new THREE.TorusGeometry(0.7, 0.28, 20, 60),
        new THREE.IcosahedronGeometry(0.7, 0),
        new THREE.ConeGeometry(0.6, 1.2, 6),
        new THREE.TetrahedronGeometry(0.7, 0)
      ];

      const colors = [0xaaaaff, 0xff88aa, 0x88ffcc, 0xffcc66, 0xcc88ff, 0x66ccff, 0xff9966];

      const placements = [
        [0,    0,    0],
        [3.2,  0.8, -1],
        [-3.0, -0.4, 1.2],
        [2.0, -1.2,  2.5],
        [-2.2, 1.5, -2],
        [-1.0, -1.8, 2.8],
        [1.5,  2.0, -2.5]
      ];

      const meshes = geos.map((g, i) => {
        const mat = new THREE.MeshStandardMaterial({
          color: colors[i],
          metalness: 0.82,
          roughness: 0.15,
          flatShading: i > 0
        });
        const m = new THREE.Mesh(g, mat);
        m.position.set(...placements[i]);
        m.userData = {
          baseY: placements[i][1],
          speed: 0.4 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2,
          rotSpeed: new THREE.Vector3(
            (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.3
          )
        };
        scene.add(m);
        return m;
      });

      return {
        scene, camera,
        needsControls: true, autoRotate: true,
        controlsCfg: { target: [0,0,0], minDist: 4, maxDist: 14 },
        update(t) {
          lights[0].position.set(Math.sin(t * 0.4) * 5, 3, Math.cos(t * 0.4) * 5);
          lights[1].position.set(Math.cos(t * 0.35) * 5, -2, Math.sin(t * 0.35) * 5);
          lights[2].position.set(Math.sin(t * 0.5) * 3, Math.cos(t * 0.5) * 4, Math.sin(t * 0.3) * 3);

          meshes.forEach(m => {
            const u = m.userData;
            m.position.y = u.baseY + Math.sin(t * u.speed + u.phase) * 0.35;
            m.rotation.x += u.rotSpeed.x * 0.008;
            m.rotation.y += u.rotSpeed.y * 0.008;
            m.rotation.z += u.rotSpeed.z * 0.008;
          });
        },
        resize(w, h) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
      };
    }

    // ============================================================
    //  DEMO 5 — NEON FLOW
    // ============================================================
    function createShader() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        uTime:       { value: 0 },
        uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
        uMouse:      { value: new THREE.Vector2(0.5, 0.5) }
      };

      const geo = new THREE.PlaneGeometry(2, 2);
      const mat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `void main(){ gl_Position = vec4(position,1.0); }`,
        fragmentShader: `
          uniform float uTime;
          uniform vec2 uResolution;
          uniform vec2 uMouse;

          void main(){
            vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / min(uResolution.x, uResolution.y);

            float t = uTime * 0.28;
            vec2 mOff = (uMouse - 0.5) * 0.6;

            vec3 col = vec3(0.0);

            for(float i = 1.0; i <= 6.0; i++){
              vec2 q = uv * (0.8 + i * 0.25) + mOff * i * 0.12;
              q += vec2(
                sin(q.y * 2.5 + t * (0.8 + i * 0.15) + i * 0.7),
                cos(q.x * 2.5 + t * (0.7 + i * 0.1)  + i * 0.5)
              ) * 0.55;

              float d = abs(sin(q.x + q.y + t + i * 0.3) * 0.5 + 0.5);
              d = pow(0.012 / d, 1.15);

              col += d * vec3(
                0.5 + 0.5 * cos(t + i * 0.9),
                0.5 + 0.5 * cos(t + i * 0.9 + 2.1),
                0.5 + 0.5 * cos(t + i * 0.9 + 4.2)
              ) / (i * 0.65);
            }

            col = pow(col, vec3(0.9));
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      scene.add(new THREE.Mesh(geo, mat));

      return {
        scene, camera,
        needsControls: false,
        update(t) {
          uniforms.uTime.value = t;
          uniforms.uMouse.value.set(
            (mouse.x + 1) * 0.5,
            (mouse.y + 1) * 0.5
          );
        },
        resize(w, h) {
          uniforms.uResolution.value.set(w, h);
        }
      };
    }

    // ============================================================
    //  DEMO 6 — RASENGAN
    // ============================================================
    function createHandDemo() {
      const scene = new THREE.Scene();
      scene.background = null;
      const aspect = innerWidth / innerHeight;
      const cam = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.1, 100);
      cam.position.z = 10;
      const videoEl = document.getElementById('handVideo');
      let handLandmarker = null, stream = null, active = false, results = null, lastDetect = 0;
      let smoothPalms = [{x:.5,y:.5},{x:.5,y:.5}], smoothOpen = [0,0], mergeFactor = 0;
      const TIPS = [4,8,12,16,20];

      // --- Pre-computed random data ---
      const coreD = Array.from({length:90},()=>({a:Math.random()*6.28,r:Math.pow(Math.random(),.7)*.45,s:(4+Math.random()*4)*(Math.random()<.3?-1:1),sz:3.5+Math.random()*3}));

      // --- Finger trail history ---
      const TLEN = 22;
      const fTrails = Array.from({length:10},()=>[]);

      // --- Particle buffer ---
      const MAX_P = 2500;
      const pPos = new Float32Array(MAX_P*3), pCol = new Float32Array(MAX_P*3), pSiz = new Float32Array(MAX_P);
      const sparks = [];
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
      pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
      pGeo.setAttribute('aSize',new THREE.BufferAttribute(pSiz,1));
      pGeo.setDrawRange(0,0);
      const pMat = new THREE.ShaderMaterial({
        transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
        vertexShader:`attribute float aSize;attribute vec3 color;varying vec3 vColor;
          void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.);
          gl_PointSize=aSize*(80./-mv.z);gl_Position=projectionMatrix*mv;}`,
        fragmentShader:`varying vec3 vColor;void main(){float d=length(gl_PointCoord-.5);
          if(d>.5)discard;float a=1.-smoothstep(0.,.5,d);gl_FragColor=vec4(vColor,a*.85);}`
      });
      scene.add(new THREE.Points(pGeo,pMat));

      // --- Finger trail lines ---
      const tlMax = 500;
      const tlPos = new Float32Array(tlMax*3), tlCol = new Float32Array(tlMax*3);
      const tlGeo = new THREE.BufferGeometry();
      tlGeo.setAttribute('position',new THREE.BufferAttribute(tlPos,3));
      tlGeo.setAttribute('color',new THREE.BufferAttribute(tlCol,3));
      tlGeo.setDrawRange(0,0);
      scene.add(new THREE.LineSegments(tlGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending})));

      // --- Helpers ---
      function mapLM(lm){
        const vw=videoEl.videoWidth||1280,vh=videoEl.videoHeight||720,vidA=vw/vh,vpA=innerWidth/innerHeight;
        let sx,sy,ox=0,oy=0;
        if(vidA>vpA){sy=1;sx=vpA/vidA;ox=(1-sx)/2;}else{sx=1;sy=vidA/vpA;oy=(1-sy)/2;}
        return{x:((1-(lm.x-ox)/sx)*2-1)*vpA,y:1-2*((lm.y-oy)/sy)};
      }
      function palmCenter(h){let x=0,y=0;for(const i of[0,5,9,13,17]){x+=h[i].x;y+=h[i].y;}return{x:x/5,y:y/5};}
      function handOpenness(h){const w=h[0];let d=0;for(const i of TIPS)d+=Math.hypot(h[i].x-w.x,h[i].y-w.y);return Math.min(Math.max((d/5-.06)/.17,0),1);}

      const blueC=new THREE.Color(0x0066ff),purpleC=new THREE.Color(0x8833ff),orangeC=new THREE.Color(0xff8800);
      const tmpC=new THREE.Color(),coreC=new THREE.Color(),glowC=new THREE.Color();
      function rasColor(op){
        if(op<.5)tmpC.copy(blueC).lerp(purpleC,op*2);else tmpC.copy(purpleC).lerp(orangeC,(op-.5)*2);
        coreC.copy(tmpC).lerp(new THREE.Color(0xffffff),.75);
        glowC.copy(tmpC).multiplyScalar(.3);
      }

      // --- RASENGAN RENDERER ---
      function writeRas(cx,cy,size,op,time,idx){
        rasColor(op);
        // Strong visible pulse — breathing
        const pulse=1+Math.sin(time*2.8)*.14+Math.sin(time*7)*.04;
        const sz=size*pulse;
        // Organic drift — center wanders slightly
        const dx=Math.sin(time*1.3)*.015*sz+Math.sin(time*3.7)*.008*sz;
        const dy=Math.cos(time*1.7)*.015*sz+Math.cos(time*4.1)*.008*sz;
        const ocx=cx+dx, ocy=cy+dy;

        // 1) GLOW — big soft aura
        for(let i=0;i<3&&idx<MAX_P;i++){
          const i3=idx*3;
          pPos[i3]=ocx;pPos[i3+1]=ocy;pPos[i3+2]=-.06;
          pCol[i3]=glowC.r;pCol[i3+1]=glowC.g;pCol[i3+2]=glowC.b;
          pSiz[idx]=(40+i*12)*sz; idx++;
        }

        // 2) CORE — 90 dense particles, BIG radius, fills the sphere solidly
        for(let i=0;i<90&&idx<MAX_P;i++){
          const c=coreD[i],a=c.a+time*c.s,r=c.r*sz;
          const i3=idx*3;
          pPos[i3]=ocx+Math.cos(a)*r;pPos[i3+1]=ocy+Math.sin(a)*r;pPos[i3+2]=Math.sin(a*2+c.a)*.04*sz;
          // Mix core white with main color based on distance from center
          const cMix=c.r/.45;
          pCol[i3]=coreC.r*(1-cMix*.3)+tmpC.r*cMix*.3;
          pCol[i3+1]=coreC.g*(1-cMix*.3)+tmpC.g*cMix*.3;
          pCol[i3+2]=coreC.b*(1-cMix*.3)+tmpC.b*cMix*.3;
          pSiz[idx]=c.sz*(.5+sz*.6); idx++;
        }

        // 3) SPIRAL BANDS — 3 arms, organic wobble, fewer but thicker
        const BANDS=3,PPB=55,TURNS=2,SPIN=5;
        for(let b=0;b<BANDS;b++){
          const bOff=b*6.28/BANDS+Math.sin(time*.7+b)*0.3;
          for(let i=0;i<PPB&&idx<MAX_P;i++){
            const t=i/PPB;
            const r=(.15+t*.85)*sz;
            const angle=bOff+t*TURNS*6.28+time*SPIN;
            const wobble=Math.sin(t*8+time*2.5+b*2)*.04*sz+Math.sin(t*15+time*5)*.015*sz;
            const i3=idx*3;
            pPos[i3]=ocx+Math.cos(angle)*(r+wobble);
            pPos[i3+1]=ocy+Math.sin(angle)*(r+wobble);
            pPos[i3+2]=Math.sin(angle*1.5+t*3)*sz*.05;
            const fade=.5+.5*Math.sin(t*6+time*3+b);
            pCol[i3]=tmpC.r*(.6+fade*.4);pCol[i3+1]=tmpC.g*(.6+fade*.4);pCol[i3+2]=tmpC.b*(.6+fade*.4);
            pSiz[idx]=(2+(1-t)*2.5)*(.3+sz*.5); idx++;
          }
        }

        // 4) Sparse edge sparks — just a few, not cluttery
        if(Math.random()<.3){
          const a=Math.random()*6.28;
          sparks.push({x:ocx+Math.cos(a)*sz*.9,y:ocy+Math.sin(a)*sz*.9,z:0,
            vx:Math.cos(a)*.02,vy:Math.sin(a)*.02,vz:0,
            life:.4+Math.random()*.2,r:tmpC.r,g:tmpC.g,b:tmpC.b,size:1.5+Math.random()*2});
        }
        return idx;
      }

      // --- Start / Stop ---
      async function start(){
        active=true;
        document.getElementById('handLoading').style.display='flex';
        try{
          stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}});
          videoEl.srcObject=stream; await videoEl.play(); videoEl.style.display='block';
          if(!handLandmarker){
            const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
            const r2=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
            handLandmarker=await v.HandLandmarker.createFromOptions(r2,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2});
          }
        }catch(e){console.error('Hand init error:',e);}
        document.getElementById('handLoading').style.display='none';
      }
      function stop(){
        active=false;
        if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
        videoEl.style.display='none'; videoEl.srcObject=null;
        results=null; sparks.length=0; fTrails.forEach(t=>t.length=0);
        pGeo.setDrawRange(0,0); tlGeo.setDrawRange(0,0);
      }

      return{
        scene,camera:cam,needsControls:false,start,stop,
        update(t){
          if(!active)return;
          const now=performance.now();
          if(handLandmarker&&videoEl.readyState>=2&&now-lastDetect>33){
            lastDetect=now;try{results=handLandmarker.detectForVideo(videoEl,now);}catch(e){}
          }
          let idx=0;
          const hands=results&&results.landmarks?results.landmarks:[];

          // --- Finger trail tracking ---
          for(let h=0;h<2;h++){
            for(let f=0;f<5;f++){
              const trail=fTrails[h*5+f];
              if(h<hands.length){
                const p=mapLM(hands[h][TIPS[f]]);
                trail.push(p);
                if(trail.length>TLEN)trail.shift();
              }else{
                if(trail.length>0)trail.shift();
              }
            }
          }

          // --- Render finger trail lines ---
          let seg=0;
          for(let ti=0;ti<10;ti++){
            const trail=fTrails[ti];
            const hIdx=Math.floor(ti/5);
            const op=hIdx<hands.length?handOpenness(hands[hIdx]):0;
            rasColor(op);
            for(let i=1;i<trail.length&&seg*2<tlMax;i++){
              const prev=trail[i-1],cur=trail[i];
              const bright=i/trail.length;
              const prevB=(i-1)/trail.length;
              const s=seg*6;
              tlPos[s]=prev.x;tlPos[s+1]=prev.y;tlPos[s+2]=.01;
              tlPos[s+3]=cur.x;tlPos[s+4]=cur.y;tlPos[s+5]=.01;
              tlCol[s]=tmpC.r*prevB*.7;tlCol[s+1]=tmpC.g*prevB*.7;tlCol[s+2]=tmpC.b*prevB*.7;
              tlCol[s+3]=tmpC.r*bright*.7;tlCol[s+4]=tmpC.g*bright*.7;tlCol[s+5]=tmpC.b*bright*.7;
              seg++;
            }
          }
          tlGeo.setDrawRange(0,seg*2);
          tlGeo.attributes.position.needsUpdate=true;
          tlGeo.attributes.color.needsUpdate=true;

          // --- Palm data ---
          const palms=hands.map((h,i)=>{
            const raw=palmCenter(h);
            smoothPalms[i].x+=(raw.x-smoothPalms[i].x)*.25;
            smoothPalms[i].y+=(raw.y-smoothPalms[i].y)*.25;
            const op=handOpenness(h);
            smoothOpen[i]+=(op-smoothOpen[i])*.15;
            const m=mapLM(smoothPalms[i]);
            return{cx:m.x,cy:m.y,open:smoothOpen[i],size:.3+smoothOpen[i]*.8};
          });

          // --- Merge ---
          const tgtM=(palms.length===2&&Math.hypot(smoothPalms[0].x-smoothPalms[1].x,smoothPalms[0].y-smoothPalms[1].y)<.14)?1:0;
          mergeFactor+=(tgtM-mergeFactor)*.08;

          if(mergeFactor>.3&&palms.length===2){
            const mcx=(palms[0].cx+palms[1].cx)/2,mcy=(palms[0].cy+palms[1].cy)/2;
            const mOp=Math.max(palms[0].open,palms[1].open);
            const mSz=(palms[0].size+palms[1].size)*(.8+mergeFactor*.9);
            idx=writeRas(mcx,mcy,mSz,mOp,t,idx);
            const shrink=1-mergeFactor*.85;
            for(const p of palms)idx=writeRas(p.cx,p.cy,p.size*shrink,p.open,t*.7,idx);
          }else{
            for(const p of palms)idx=writeRas(p.cx,p.cy,p.size,p.open,t,idx);
          }

          // --- Spark trails ---
          let alive=0;
          for(let i=0;i<sparks.length;i++){
            const p=sparks[i];p.life-=.02;if(p.life<=0)continue;
            p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;
            if(idx<MAX_P){const i3=idx*3;pPos[i3]=p.x;pPos[i3+1]=p.y;pPos[i3+2]=p.z;
              pCol[i3]=p.r;pCol[i3+1]=p.g;pCol[i3+2]=p.b;pSiz[idx]=p.size*Math.min(p.life,1);idx++;}
            sparks[alive]=p;alive++;
          }
          sparks.length=alive;

          pGeo.setDrawRange(0,idx);
          pGeo.attributes.position.needsUpdate=true;
          pGeo.attributes.color.needsUpdate=true;
          pGeo.attributes.aSize.needsUpdate=true;
        },
        resize(w,h){const a=w/h;cam.left=-a;cam.right=a;cam.updateProjectionMatrix();}
      };
    }

    // ============================================================
    //  UI HELPERS
    // ============================================================
    function updateInfoCard(name) {
      const m = DEMO_META[name];
      const card = document.getElementById('infoCard');
      document.getElementById('infoTag').textContent   = m.tag;
      document.getElementById('infoTitle').textContent  = m.title;
      document.getElementById('infoDesc').textContent   = m.desc;
      document.getElementById('infoHint').textContent   = m.hint;

      // Retrigger animation
      card.style.animation = 'none';
      card.offsetHeight; // reflow
      card.style.animation = 'cardIn 0.5s ease-out forwards';
    }

    function switchDemo(name) {
      if (name === currentName) return;

      // Stop camera when leaving hands
      if (currentName === 'hands' && currentDemo && currentDemo.stop) currentDemo.stop();

      // Fade out
      canvas.style.opacity = '0';

      setTimeout(() => {
        // Dispose old controls
        if (activeControls) { activeControls.dispose(); activeControls = null; }

        currentName = name;
        currentDemo = demos[name];

        // Setup new controls
        if (currentDemo.needsControls) {
          activeControls = new OrbitControls(currentDemo.camera, canvas);
          activeControls.enableDamping = true;
          activeControls.dampingFactor = 0.06;
          activeControls.enablePan = false;
          if (currentDemo.controlsCfg) {
            const c = currentDemo.controlsCfg;
            activeControls.target.set(...c.target);
            activeControls.minDistance = c.minDist;
            activeControls.maxDistance = c.maxDist;
          }
          if (currentDemo.autoRotate) {
            activeControls.autoRotate = true;
            activeControls.autoRotateSpeed = 0.8;
          }
        }

        updateInfoCard(name);

        // Update tab UI
        document.querySelectorAll('.tab').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.demo === name);
        });

        // Start camera when entering hands
        if (name === 'hands' && currentDemo.start) currentDemo.start();

        // Fade in
        canvas.style.opacity = '1';
      }, 350);
    }

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    function animate() {
      requestAnimationFrame(animate);
      const t = performance.now() * 0.001;

      if (currentDemo) {
        currentDemo.update(t);
        if (activeControls) activeControls.update();
        renderer.render(currentDemo.scene, currentDemo.camera);
      }

      // FPS
      fpsFrames++;
      if (t * 1000 - fpsLast > 500) {
        fpsEl.textContent = Math.round(fpsFrames / ((t * 1000 - fpsLast) / 1000)) + ' FPS';
        fpsFrames = 0; fpsLast = t * 1000;
      }
    }

    // ============================================================
    //  EVENTS
    // ============================================================
    window.addEventListener('resize', () => {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h);
      Object.values(demos).forEach(d => d.resize(w, h));
    });

    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / innerWidth)  * 2 - 1;
      mouse.y = (e.clientY / innerHeight) * 2 - 1;
    });

    window.addEventListener('touchmove', e => {
      if (e.touches.length) {
        mouse.x = (e.touches[0].clientX / innerWidth)  * 2 - 1;
        mouse.y = (e.touches[0].clientY / innerHeight) * 2 - 1;
      }
    }, { passive: true });

    document.getElementById('navTabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (btn && btn.dataset.demo) switchDemo(btn.dataset.demo);
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      const keys = ['1','2','3','4','5','6'];
      const names = ['particles','blob','terrain','geometry','shader','hands'];
      const idx = keys.indexOf(e.key);
      if (idx !== -1) switchDemo(names[idx]);
    });

    // ============================================================
